[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sangampay"
version = "1.0.0"
description = "Python SDK for SangamPay, the open-source payment orchestration platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []
keywords = ["payments", "upi", "razorpay", "stripe", "paypal", "gst", "subscriptions"]

[tool.setuptools]
packages = ["sangampay"]
