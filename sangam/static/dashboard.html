<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SangamPay Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4fb;--surface:#fff;--surface-2:#f9f8fd;--fg:#16132b;--muted:#6b6886;--line:#ebe8f5;
  --brand:#5b3df5;--brand-2:#0fb5a6;--ring:rgba(91,61,245,.2);--side:#120f24;--side-fg:#cfcbe6;
  --ok:#0e9f6e;--ok-bg:#e6f7f0;--warn:#b7791f;--warn-bg:#fdf3e1;--err:#d92d20;--err-bg:#fdecea;--info:#2563eb;--info-bg:#e8effd;--neutral-bg:#f0eef7;
  --shadow:0 1px 2px rgba(22,19,43,.04),0 8px 24px -12px rgba(40,24,120,.12);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0a14;--surface:#15131f;--surface-2:#1b1928;--fg:#f1effa;--muted:#9a96b3;--line:#272439;
  --brand:#8b74ff;--brand-2:#2dd4bf;--ring:rgba(139,116,255,.28);--side:#0f0d1a;--side-fg:#a9a4c4;
  --ok:#34d399;--ok-bg:#0f2a22;--warn:#f6c26b;--warn-bg:#2b2213;--err:#ff8a7a;--err-bg:#2e1614;--info:#7aa7ff;--info-bg:#152038;--neutral-bg:#221f31;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff}
.logo b{font-weight:800}
.logo span{color:var(--brand)}

/* Layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-fg);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.side .logo{color:#fff;padding:0 8px}
.side .logo span{color:#a99bff}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--side-fg);font-weight:500}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button[aria-current=page]{background:rgba(139,116,255,.16);color:#fff;font-weight:600}
.nav button[aria-current=page] svg{color:#a99bff}
.side-foot{margin-top:auto;display:grid;gap:12px}
.mode{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;padding:8px 12px;border-radius:10px;background:rgba(255,209,102,.12);color:#ffd166}
.mode.live{background:rgba(52,211,153,.12);color:#34d399}
.mode i{width:7px;height:7px;border-radius:50%;background:currentColor}
.who{display:flex;align-items:center;gap:10px;padding:8px}
.who .av{width:34px;height:34px;border-radius:10px;background:#2a2547;color:#fff;display:grid;place-items:center;font-weight:700}
.who .n{color:#fff;font-weight:600;font-size:13px;line-height:1.2}
.who button{background:none;border:0;padding:0;color:var(--side-fg);font-size:12px;cursor:pointer}
.who button:hover{color:#fff}
.main{padding:28px 32px 60px;min-width:0;max-width:1200px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{margin:0;font-size:24px;letter-spacing:-.02em}
.page-head p{margin:2px 0 0;color:var(--muted)}

/* Components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-head h2{margin:0;font-size:15px}
.card-body{padding:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:18px 20px;position:relative;overflow:hidden}
.stat .lbl{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.stat .val{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .val small{font-size:14px;color:var(--muted);font-weight:600;margin-right:4px}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat.hero{background:linear-gradient(140deg,#2a1a8a,#5b3df5 60%,#0fb5a6 140%);color:#fff;border:0}
.stat.hero .lbl,.stat.hero .sub,.stat.hero .val small{color:rgba(255,255,255,.8)}
.ico-dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--neutral-bg);color:var(--brand)}
.stat.hero .ico-dot{background:rgba(255,255,255,.18);color:#fff}

.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer;
  background:var(--brand);color:#fff;transition:filter .15s,transform .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.danger{background:var(--err-bg);color:var(--err)}
.btn.success{background:var(--ok-bg);color:var(--ok)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.chip[aria-pressed=true]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.chip .c{opacity:.6;margin-left:4px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:11px 20px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 20px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.amt{font-weight:700}
.amt small{color:var(--muted);font-weight:600;margin-right:3px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted)}
.cell-main{font-weight:600}
.cell-sub{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:6px;justify-content:flex-end}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;text-transform:capitalize}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-err{background:var(--err-bg);color:var(--err)}.b-info{background:var(--info-bg);color:var(--info)}.b-neutral{background:var(--neutral-bg);color:var(--muted)}
.method-pill{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.method-pill svg{color:var(--muted)}

.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .big{width:52px;height:52px;border-radius:16px;margin:0 auto 12px;display:grid;place-items:center;background:var(--neutral-bg);color:var(--brand)}
.empty h3{color:var(--fg);margin:0 0 4px;font-size:15px}

.field{display:grid;gap:6px}
.field label{font-size:12.5px;font-weight:600}
.field .help{font-size:12px;color:var(--muted)}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.amount-input{position:relative}
.amount-input select{position:absolute;left:4px;top:4px;bottom:4px;width:78px;border:0;background:var(--surface-2);padding:0 8px;font-weight:600}
.amount-input input{padding-left:92px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

.gateways{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.gw{display:flex;flex-direction:column}
.gw-head{display:flex;align-items:center;gap:12px;padding:18px 20px 12px}
.gw-logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none}
.gw-title{font-weight:700;font-size:15px}
.gw-sub{font-size:12.5px;color:var(--muted)}
.gw-body{padding:0 20px 18px;display:grid;gap:12px;flex:1}
.gw-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface-2);border-radius:0 0 16px 16px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--neutral-bg);color:var(--muted)}
.copy{display:flex;gap:6px;align-items:center;background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:6px 8px;font-size:11.5px}
.copy code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.copy button{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;font-size:11.5px}

.route{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.route:last-child{border-bottom:0}
.route-name{font-weight:600;text-transform:capitalize}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flow .node{padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;font-weight:600}
.flow .arrow{color:var(--muted);font-size:12px}

.vault-row{display:flex;align-items:center;gap:14px}
.bank-ico{width:38px;height:38px;border-radius:11px;background:var(--neutral-bg);display:grid;place-items:center;color:var(--brand);flex:none}
.secure-note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:var(--info-bg);color:var(--info);font-size:13px;margin-bottom:18px}
.secure-note b{color:inherit}

/* Modal + toast */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--fg);width:min(480px,calc(100vw - 32px));box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(15,12,35,.45);backdrop-filter:blur(3px)}
.m-head{padding:20px 22px 0}
.m-head h3{margin:0;font-size:17px}
.m-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.m-body{padding:18px 22px;display:grid;gap:14px}
.m-foot{padding:14px 22px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);background:var(--surface-2)}
.secret-box{display:grid;gap:4px;padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.secret-box code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
.toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:50}
.toast{display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--surface);padding:11px 16px;border-radius:12px;font-weight:600;font-size:13.5px;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:tin .2s ease}
.toast.err{background:var(--err);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.sk{height:16px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-art{background:linear-gradient(150deg,#1d1160,#5b3df5 55%,#0fb5a6 140%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 24px)}
.login-art .logo{color:#fff;position:relative;z-index:1}.login-art .logo span{color:#c9bfff}
.login-art h2{font-size:34px;line-height:1.15;letter-spacing:-.03em;margin:0 0 14px;max-width:440px;position:relative;z-index:1}
.login-art ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;position:relative;z-index:1;opacity:.92}
.login-art li{display:flex;gap:10px;align-items:center}
.login-form{display:grid;place-items:center;padding:32px 20px}
.login-form .box{width:100%;max-width:380px;display:grid;gap:16px}
.login-form h1{margin:0;font-size:24px;letter-spacing:-.02em}
.login-form p{margin:0;color:var(--muted)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

.mobile-bar{display:none}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobile-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--side);color:#fff;position:sticky;top:0;z-index:5}
  .mobile-bar .logo{color:#fff}.mobile-bar .logo span{color:#a99bff}
  .mobile-nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mobile-nav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:12.5px;cursor:pointer}
  .mobile-nav button[aria-current=page]{background:var(--brand);color:#fff;border-color:var(--brand)}
  .main{padding:20px 16px 48px}
  .login{grid-template-columns:1fr}.login-art{display:none}
  .route{grid-template-columns:1fr}
  .gateways{grid-template-columns:1fr}
}
@media (min-width:881px){.mobile-nav{display:none}}

/* v1.0 additions */
.nav-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#6f6a8f;font-weight:700;padding:14px 12px 4px}
.side{overflow-y:auto}
.nav{gap:1px}.nav button{padding:8px 12px;font-size:13.5px}
.chart{width:100%;height:220px;display:block}
.chart .bar{fill:var(--brand);opacity:.85;transition:opacity .15s}.chart .bar:hover{opacity:1}
.chart .grid{stroke:var(--line);stroke-width:1}.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.split{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:18px}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.list-rows{display:grid}.list-rows .lr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 20px;border-bottom:1px solid var(--line)}
.list-rows .lr:last-child{border-bottom:0}
.meter{height:6px;border-radius:99px;background:var(--neutral-bg);overflow:hidden;width:120px}.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.textarea{font:inherit;width:100%;min-height:140px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:inherit;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.line-items{display:grid;gap:8px}.li-row{display:grid;grid-template-columns:2fr 70px 110px 80px 32px;gap:6px;align-items:center}
@media (max-width:640px){.li-row{grid-template-columns:1fr 1fr}}
.qr-box{display:grid;place-items:center;padding:12px;background:#fff;border-radius:12px;width:max-content;margin:0 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
dialog{width:min(560px,calc(100vw - 32px))}
.m-body{max-height:65vh;overflow-y:auto}
</style>
</head>
<body>
<div id="root"></div>
<dialog id="modal"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/assets/dashboard.js"></script>
</body>
</html>
