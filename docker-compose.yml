services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sangam
      POSTGRES_PASSWORD: sangam
      POSTGRES_DB: sangam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sangam"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      SANGAM_RUN_WORKERS: "false"   # the worker service below runs background jobs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "sangam.workers"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
